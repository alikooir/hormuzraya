# Nginx config for hormozraya.ir behind ArvanCloud CDN.
# Arvan handles HTTPS and the http->https redirect at its edge and talks to this
# server over plain HTTP (port 80), so there is no certificate or redirect to https here.
#
# 1. Copy the contents of public/ to /var/www/hormozraya
# 2. Save this file as /etc/nginx/sites-available/hormozraya and link it into sites-enabled
# 3. nginx -t && systemctl reload nginx
# 4. In the Arvan panel: SSL/TLS -> enable the free certificate, turn on HTTPS redirect,
#    and set the origin (connection to server) protocol to HTTP.

# The second spelling and www names go to the main domain
server {
    listen 80;
    listen [::]:80;
    server_name www.hormozraya.ir hormuzraya.ir www.hormuzraya.ir;
    return 301 https://hormozraya.ir$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name hormozraya.ir;

    root /var/www/hormozraya;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
