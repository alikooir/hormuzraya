# Nginx config for hormozraya.ir (main) and hormuzraya.ir (redirects to main).
# 1. Copy the contents of public/ to /var/www/hormozraya
# 2. Put this file in /etc/nginx/sites-available/hormozraya and link it into sites-enabled
# 3. Get certificates: certbot --nginx -d hormozraya.ir -d www.hormozraya.ir -d hormuzraya.ir -d www.hormuzraya.ir
# 4. nginx -t && systemctl reload nginx

# All plain-HTTP traffic, on every name, goes to https://hormozraya.ir
server {
    listen 80;
    listen [::]:80;
    server_name hormozraya.ir www.hormozraya.ir hormuzraya.ir www.hormuzraya.ir;
    return 301 https://hormozraya.ir$request_uri;
}

# The second spelling and the www names redirect to the main domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hormozraya.ir hormuzraya.ir www.hormuzraya.ir;
    ssl_certificate     /etc/letsencrypt/live/hormozraya.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hormozraya.ir/privkey.pem;
    return 301 https://hormozraya.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hormozraya.ir;
    ssl_certificate     /etc/letsencrypt/live/hormozraya.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hormozraya.ir/privkey.pem;

    root /var/www/hormozraya;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    # Long cache for fonts, images, CSS and JS
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /en/ {
        try_files $uri $uri/ =404;
        error_page 404 /en/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
